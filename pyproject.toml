[project]
name = "henselization"
version = "0.0.0"
authors = [
  {name = "Julian Rüth"},
]
description = "Henselizations in SageMath"
readme = "README.md"
dependencies = [
  "recursive-monkey-patch @ git+https://github.com/saraedum/recursive-monkey-patch.git@import",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["henselization*"]

[tool.pixi.workspace]
name = "henselization"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
henselization = { path = ".", editable = true }

[tool.pixi.dependencies]
sagelib = "*"
ipywidgets = "*"

[tool.pixi.tasks]
doctest = "sage -tp --initial henselization"
doctest-long = "sage -tp --long --initial henselization"
